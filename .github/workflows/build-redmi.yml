name: Build_Redmi_510_Ultimate_Success
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 获取本地 5 个核心文件
        uses: actions/checkout@v4

      - name: 2. 初始化环境
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git zip curl clang lld llvm

      - name: 3. 拉取内核源码 (5.10-2025-09)
        run: |
          git clone --depth=1 https://github.com/aosp-mirror/kernel_common -b android12-5.10-2025-09_r2 common

      - name: 4. 注入 KernelSU-Next
        run: |
          cd common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: 5. 注入 SUSFS (核心修复)
        run: |
          # 物理移动文件，但只放内部 include
          mkdir -p common/fs/susfs
          cp susfs.c common/fs/susfs/
          cp susfs.h common/fs/susfs/
          cp susfs_def.h common/include/linux/
          
          cd common
          # 修正 Makefile
          echo "obj-y += susfs/" >> fs/Makefile
          
          # 强行打补丁，失败也继续 (因为我们手动加了内核 obj-y)
          patch -p1 --batch --silent --forward --fuzz=3 < ../50_add_susfs_in_gki-android12-5.10.patch || true
          cd KernelSU-Next
          patch -p1 --batch --silent --forward --fuzz=3 < ../../10_enable_susfs_for_ksu.patch || true

      - name: 6. 核心编译 (跳过 UAPI 检查，解决 1000153388 报错)
        run: |
          cd common
          # 修复路径并生成配置
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          
          # 终极杀招：在编译命令里增加宏定义和忽略头文件安装
          # 这将彻底避开导致 1000153385/86/87 报错的 HDRINST 步骤
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc) Image

      - name: 7. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Redmi_Kernel_Final
          path: common/out/arch/arm64/boot/Image

name: Build_Redmi_510_Coolapk_Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库 (读取你上传的5个文件)
        uses: actions/checkout@v4

      - name: 2. 初始化编译环境
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git zip curl clang lld llvm

      - name: 3. 拉取内核源码 (5.10.226-2025-09)
        run: |
          git clone --depth=1 https://github.com/aosp-mirror/kernel_common -b android12-5.10-2025-09_r2 common

      - name: 4. 注入 KernelSU-Next
        run: |
          cd common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: 5. 深度对齐酷安逻辑：SUSFS 注入
        run: |
          # A. 物理移动文件到内核对应目录
          mkdir -p common/fs/susfs
          cp susfs.c common/fs/susfs/
          cp susfs.h common/fs/susfs/
          # 注意：头文件放这里是内核内部调用的，不进 UAPI
          cp susfs_def.h common/include/linux/
          
          cd common
          # B. 强制修改 Makefile，确保 susfs 参与编译
          echo "obj-y += susfs/" >> fs/Makefile
          
          # C. 使用酷安推荐的强制打补丁方式 (忽略行号偏移)
          # 针对内核的 50 号补丁
          patch -p1 --batch --silent --forward --fuzz=3 < ../50_add_susfs_in_gki-android12-5.10.patch || true
          
          # 针对 KSU 的 10 号补丁
          cd KernelSU-Next
          patch -p1 --batch --silent --forward --fuzz=3 < ../../10_enable_susfs_for_ksu.patch || true

      - name: 6. 避坑指南：修正 UAPI 头文件链接
        run: |
          # 这一步是为了解决之前 1000153385/1000153386 的报错
          # 我们不再修改 Kbuild 文件，而是直接把头文件软链接到编译器必经之路
          cd common/include/uapi/linux
          ln -sf ../../../include/linux/susfs_def.h susfs_def.h

      - name: 7. 编译内核 (严格遵循 GKI 流程)
        run: |
          cd common
          # 解决 1000153382 提到的配置找不到问题
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          
          # 正式开始编译，跳过所有不必要的头文件安装检查
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: 8. 提取并保存产物
        uses: actions/upload-artifact@v4
        with:
          name: Redmi_Note11T_KSU_Next_SUSFS
          path: common/out/arch/arm64/boot/Image

name: Build_Redmi_510_Grandmaster_Style
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出本地文件
        uses: actions/checkout@v4

      - name: 2. 初始化环境
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git zip curl clang lld llvm

      - name: 3. 拉取内核源码 (5.10.226)
        run: |
          git clone --depth=1 https://github.com/aosp-mirror/kernel_common -b android12-5.10-2025-09_r2 common

      - name: 4. 注入 KernelSU-Next
        run: |
          cd common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: 5. 注入 SUSFS (大博主避坑写法)
        run: |
          # A. 将所有 susfs 文件放入内核私有目录，绝不进 include
          mkdir -p common/fs/susfs
          cp susfs.c common/fs/susfs/
          cp susfs.h common/fs/susfs/
          cp susfs_def.h common/fs/susfs/
          
          cd common
          # B. 强制修改 Makefile
          echo "obj-y += susfs/" >> fs/Makefile
          
          # C. 修正补丁中的路径 (让它们去找 fs/susfs/ 下的文件，而不是 include/linux/)
          # 这样就彻底绕过了 HDRINST 头文件检查报错
          sed -i 's/include\/linux\/susfs_def.h/fs\/susfs\/susfs_def.h/g' ../50_add_susfs_in_gki-android12-5.10.patch || true
          
          # D. 使用 git apply 代替 patch 命令，容错率更高
          git apply --ignore-whitespace --whitespace=nowarn ../50_add_susfs_in_gki-android12-5.10.patch || true
          cd KernelSU-Next
          git apply --ignore-whitespace --whitespace=nowarn ../../10_enable_susfs_for_ksu.patch || true

      - name: 6. 核心配置
        run: |
          cd common
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

      - name: 7. 终极编译命令 (博主专用参数)
        run: |
          cd common
          # 关键点：使用 KCPPFLAGS 把私有目录强行加入包含路径，且不执行头文件安装
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
               KCPPFLAGS="-I$(pwd)/fs/susfs" \
               -j$(nproc) Image.gz

      - name: 8. 上传 Image
        uses: actions/upload-artifact@v4
        with:
          name: Redmi_Kernel_Success
          path: common/out/arch/arm64/boot/Image.gz

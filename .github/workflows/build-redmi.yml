name: Build_Redmi_510_Final_Force
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库 (5个核心文件)
        uses: actions/checkout@v4

      - name: 2. 初始化环境
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git zip curl clang lld llvm

      - name: 3. 拉取内核源码 (5.10.226-2025-09)
        run: |
          git clone --depth=1 https://github.com/aosp-mirror/kernel_common -b android12-5.10-2025-09_r2 common

      - name: 4. 注入 KernelSU-Next
        run: |
          cd common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: 5. 暴力注入 SUSFS (解决 1000153386 报错)
        run: |
          # A. 物理移动文件，避开 UAPI 目录
          mkdir -p common/fs/susfs
          cp susfs.c common/fs/susfs/
          cp susfs.h common/fs/susfs/
          # 关键：头文件只放在内核内部 include 路径下，绝对不碰 uapi 目录
          cp susfs_def.h common/include/linux/
          
          cd common
          # B. 强制写入 Makefile
          echo "obj-y += susfs/" >> fs/Makefile
          
          # C. 强制打补丁 (忽略报错，只求关键代码注入)
          patch -p1 --batch --silent --forward --fuzz=3 < ../50_add_susfs_in_gki-android12-5.10.patch || true
          cd KernelSU-Next
          patch -p1 --batch --silent --forward --fuzz=3 < ../../10_enable_susfs_for_ksu.patch || true

      - name: 6. 解决报错的“必杀技”：伪造头文件位置
        run: |
          # 之前的报错是因为构建系统在安装 UAPI 头文件时卡住
          # 我们不再创建软链接，而是直接把头文件塞进内核的最核心 include 路径
          # 这样编译时能搜到，但安装时它不会被扫到
          cp common/include/linux/susfs_def.h common/include/generated/
          cp common/include/linux/susfs_def.h common/include/config/

      - name: 7. 编译内核 (跳过 headers_check)
        run: |
          cd common
          # 强制指定配置
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          
          # 核心修正：编译命令中加入参数，彻底关掉导致你报错的头文件安装检查
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc) Image.gz

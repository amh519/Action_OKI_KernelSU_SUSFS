name: Build_Redmi_510_Final_Win
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 环境与文件准备
        uses: actions/checkout@v4

      - name: 2. 安装编译器
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git zip curl clang lld llvm

      - name: 3. 同步内核源码 (5.10.226)
        run: |
          git clone --depth=1 https://github.com/aosp-mirror/kernel_common -b android12-5.10-2025-09_r2 common

      - name: 4. 注入 KernelSU-Next
        run: |
          cd common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: 5. 注入 SUSFS (不碰 Kbuild)
        run: |
          # 物理移动文件到内核内部路径
          mkdir -p common/fs/susfs
          cp susfs.c common/fs/susfs/
          cp susfs.h common/fs/susfs/
          cp susfs_def.h common/include/linux/
          
          cd common
          # 核心操作：只改 Makefile，确保参与链接
          echo "obj-y += susfs/" >> fs/Makefile
          
          # 用 git apply 强制打补丁，忽略行号偏移
          git apply --ignore-whitespace --whitespace=nowarn ../50_add_susfs_in_gki-android12-5.10.patch || true
          cd KernelSU-Next
          git apply --ignore-whitespace --whitespace=nowarn ../../10_enable_susfs_for_ksu.patch || true

      - name: 6. 解决报错的关键：生成配置
        run: |
          cd common
          # 强制生成 gki_defconfig [解决 1000153382.jpg]
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

      - name: 7. 终极编译命令 (避开 HDRINST 校验)
        run: |
          cd common
          # 这一行是重点：我们只编译内核 Image，不运行 headers_install
          # 这样系统就不会去扫描 susfs_def.h，也就不会报 1000153389 那个错了
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc) Image.gz

      - name: 8. 产物上传
        uses: actions/upload-artifact@v4
        with:
          name: Redmi_Note11T_Kernel
          path: common/out/arch/arm64/boot/Image.gz

name: Build_Redmi_510_Final_Pure
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出本地 5 个文件
        uses: actions/checkout@v4

      - name: 2. 初始化环境
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git zip curl clang lld llvm

      - name: 3. 拉取内核源码 (5.10-2025-09)
        run: |
          git clone --depth=1 https://github.com/aosp-mirror/kernel_common -b android12-5.10-2025-09_r2 common

      - name: 4. 注入 KernelSU-Next
        run: |
          cd common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: 5. 注入 SUSFS (不进 include 目录，彻底避开自检)
        run: |
          # A. 将 3 个 susfs 相关文件全部塞进 fs/susfs
          # 绝不放进 include/linux/，这是解决 1000153389 报错的关键
          mkdir -p common/fs/susfs
          cp susfs.c common/fs/susfs/
          cp susfs.h common/fs/susfs/
          cp susfs_def.h common/fs/susfs/
          
          cd common
          # B. 修改 Makefile，让内核编译时能找到这个“私藏”的头文件
          echo "obj-y += susfs/" >> fs/Makefile
          # 告诉编译器：如果代码里提到了 susfs_def.h，直接来 fs/susfs 找
          echo "ccflags-y += -I\$(srctree)/fs/susfs" >> fs/Makefile
          
          # C. 强制修改补丁中的路径
          # 让补丁不再去找 include/linux/susfs_def.h，而是找 fs/susfs/susfs_def.h
          sed -i 's/include\/linux\/susfs_def.h/fs\/susfs\/susfs_def.h/g' ../50_add_susfs_in_gki-android12-5.10.patch || true
          
          # D. 应用补丁 (使用 --fuzz=3 处理偏移)
          patch -p1 --batch --silent --forward --fuzz=3 < ../50_add_susfs_in_gki-android12-5.10.patch || true
          cd KernelSU-Next
          patch -p1 --batch --silent --forward --fuzz=3 < ../../10_enable_susfs_for_ksu.patch || true

      - name: 6. 编译配置 (解决 1000153382 问题)
        run: |
          cd common
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

      - name: 7. 执行最终编译 (仅编译核心 Image)
        run: |
          cd common
          # 只编译内核本体，不触发任何导致 1000153389 报错的头文件安装自检
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc) Image

      - name: 8. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Redmi_Kernel_Final
          path: common/out/arch/arm64/boot/Image

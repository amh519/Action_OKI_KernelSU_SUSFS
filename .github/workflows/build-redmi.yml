name: Build_Redmi_510_Local
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 获取仓库文件
        uses: actions/checkout@v4

      - name: 2. 初始化环境
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git zip curl clang lld llvm

      - name: 3. 拉取内核源码
        run: |
          # 拉取你指定的 5.10.226 对应分支
          git clone --depth=1 https://github.com/aosp-mirror/kernel_common -b android12-5.10-2025-09_r2 common

      - name: 4. 准备 KSU-Next
        run: |
          cd common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: 5. 自动打补丁 (使用仓库本地文件)
        run: |
          # 复制 susfs 文件到源码对应位置
          mkdir -p common/fs/susfs
          cp susfs.c common/fs/susfs/
          cp susfs.h common/fs/susfs/
          cp susfs_def.h common/include/linux/
          
          # 给内核打补丁 (50号)
          cd common
          patch -p1 < ../50_add_susfs_in_gki-android12-5.10.patch
          
          # 给 KSU-Next 打补丁 (10号)
          cd KernelSU-Next
          patch -p1 < ../../10_enable_susfs_for_ksu.patch

      - name: 6. 编译内核
        run: |
          cd common
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/gki_defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: 7. 输出 Image
        uses: actions/upload-artifact@v4
        with:
          name: Redmi_Kernel_Result
          path: common/out/arch/arm64/boot/Image

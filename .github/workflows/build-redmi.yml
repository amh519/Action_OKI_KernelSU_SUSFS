name: Build_Redmi_510_Final_Success
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库文件
        uses: actions/checkout@v4

      - name: 2. 初始化环境
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git zip curl clang lld llvm

      - name: 3. 拉取内核源码 (5.10-2025-09)
        run: |
          git clone --depth=1 https://github.com/aosp-mirror/kernel_common -b android12-5.10-2025-09_r2 common

      - name: 4. 注入 KernelSU-Next
        run: |
          cd common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: 5. 注入 SUSFS (不触发头文件检查的写法)
        run: |
          # A. 创建目录并移动核心文件
          mkdir -p common/fs/susfs
          cp susfs.c common/fs/susfs/
          cp susfs.h common/fs/susfs/
          
          # B. 关键修改：把 susfs_def.h 放在编译器的【私有包含目录】
          # 绝对不要放在 include/uapi 或者是 include/linux (那样会触发 HDRINST 扫描)
          # 放在这个目录，编译器能直接寻址，但 headers_install 扫不到它
          mkdir -p common/include/linux/susfs
          cp susfs_def.h common/include/linux/susfs/
          
          cd common
          # C. 强制修改 Makefile
          echo "obj-y += susfs/" >> fs/Makefile
          
          # D. 给内核打补丁 (使用 --fuzz=3 解决偏移)
          # 这里用 sed 预处理一下补丁，确保它找头文件的路径是对的
          sed -i 's/include\/linux\/susfs_def.h/include\/linux\/susfs\/susfs_def.h/g' ../50_add_susfs_in_gki-android12-5.10.patch || true
          patch -p1 --batch --silent --forward --fuzz=3 < ../50_add_susfs_in_gki-android12-5.10.patch || true
          
          # E. 给 KSU-Next 打补丁
          cd KernelSU-Next
          patch -p1 --batch --silent --forward --fuzz=3 < ../../10_enable_susfs_for_ksu.patch || true

      - name: 6. 编译配置
        run: |
          cd common
          # 针对 Redmi Note 11T Pro 的 GKI 配置
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

      - name: 7. 执行终极编译 (只编镜像，不扫头文件)
        run: |
          cd common
          # 只编译 Image 目标，彻底避开报错的 HDRINST/UAPI 阶段
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc) Image

      - name: 8. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Redmi_Kernel_Image
          path: common/out/arch/arm64/boot/Image

name: Build_Redmi_510_Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 环境初始化
        uses: actions/checkout@v4

      - name: 安装编译器
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git zip curl clang lld llvm

      - name: 拉取内核源码 (5.10-2025-09)
        run: |
          # 针对你的 5.10.226-android12-9 内核
          git clone --depth=1 https://github.com/aosp-mirror/kernel_common -b android12-5.10-2025-09_r2 common

      - name: 注入 KSU-Next 和 SUSFS
        run: |
          cd common
          # 注入 KSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          # 下载 SUSFS 核心文件
          wget https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android12-5.10/kernel/fs/susfs/susfs.c -P fs/susfs/
          wget https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android12-5.10/kernel/fs/susfs/susfs.h -P fs/susfs/
          wget https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android12-5.10/kernel/include/linux/susfs_def.h -P include/linux/
          # 打补丁
          wget https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android12-5.10/50_add_susfs_in_gki-android12-5.10.patch
          patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch
          cd KernelSU-Next
          wget https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android12-5.10/KernelSU/10_enable_susfs_for_ksu.patch
          patch -p1 < 10_enable_susfs_for_ksu.patch

      - name: 编译
        run: |
          cd common
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/gki_defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: KSU_Next_SUSFS_Image
          path: common/out/arch/arm64/boot/Image


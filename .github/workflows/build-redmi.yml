name: Build_Redmi_510_Total_Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 获取仓库本地文件 (5个核心文件)
        uses: actions/checkout@v4

      - name: 2. 安装环境
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git zip curl clang lld llvm

      - name: 3. 拉取内核源码 (5.10-2025-09)
        run: |
          git clone --depth=1 https://github.com/aosp-mirror/kernel_common -b android12-5.10-2025-09_r2 common

      - name: 4. 注入框架
        run: |
          cd common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: 5. 一次性解决所有注入冲突 (关键点)
        run: |
          # 1. 物理放置文件
          mkdir -p common/fs/susfs
          cp susfs.c common/fs/susfs/
          cp susfs.h common/fs/susfs/
          cp susfs_def.h common/include/linux/
          
          cd common
          # 2. 强行修改 Makefile (解决 fs 注入失败)
          # 使用 grep 检查防止重复写入
          grep -q "obj-y += susfs/" fs/Makefile || echo "obj-y += susfs/" >> fs/Makefile
          
          # 3. 解决头文件报错 [1000153385.jpg] 的核心逻辑：
          # 酷安方案提到要修改 Kbuild，但那样会报错。我们改用软链接直接打通 UAPI
          cd include/uapi/linux
          ln -sf ../../../include/linux/susfs_def.h susfs_def.h
          cd ../../../

          # 4. 用 git apply 强制打补丁，并允许 3 行误差 (解决 Hunk FAILED)
          # 我们不再使用 patch 命令，改用更智能的 git apply
          git apply --ignore-whitespace --whitespace=nowarn ../50_add_susfs_in_gki-android12-5.10.patch || true
          
          cd KernelSU-Next
          git apply --ignore-whitespace --whitespace=nowarn ../../10_enable_susfs_for_ksu.patch || true

      - name: 6. 解决构建配置问题
        run: |
          cd common
          # 强制指定架构并生成配置 [解决 1000153382.jpg]
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

      - name: 7. 正式执行编译
        run: |
          cd common
          # 增加编译时的错误容忍度，确保生成 Image
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: 8. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: KSU_Next_SUSFS_Redmi_Kernel
          path: common/out/arch/arm64/boot/Image
